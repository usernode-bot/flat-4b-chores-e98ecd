<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Flat 4B Chores</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%235f7653'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- The weekly rota, from design/sketch.html: header, one card per
       chore, and the "rotates every Monday" note. Built from the design
       kit in styles/tailwind-input.css; CLAUDE.md's "## Design" says how. -->
  <main class="mx-auto flex max-w-md flex-col gap-8 px-4 py-10">

    <!-- The bin-night reminder, at the very top. Shown only from 5 pm on the
         day before bins are due, and on the due day itself; computed from the
         viewer's own clock, since the server cannot know their time zone. -->
    <div id="bin-banner" class="card bg-accent text-on-accent text-body font-medium" hidden></div>

    <header class="px-4 py-6 bg-surface">
      <h1 class="text-title font-bold text-fg">Flat 4B Chores</h1>
      <p id="week-line" class="text-muted text-small"></p>
    </header>

    <section aria-label="This week's chores" class="flex flex-col gap-3">
      <!-- Anything that loads data shows exactly one of these at a time:
           loading, the data, empty (it loaded, and there is nobody yet)
           or error (it did not load). The script below switches them. -->
      <div id="state-loading" role="status" class="flex flex-col gap-3">
        <span class="sr-only">Loading the rota</span>
        <div class="card bg-raised border border-line rounded-lg p-4">
          <div class="mb-3 flex items-start justify-between gap-3">
            <div class="flex min-w-0 flex-col gap-2">
              <div class="skeleton h-5 w-24"></div>
              <div class="skeleton h-4 w-32"></div>
            </div>
            <div class="skeleton h-11 w-32 rounded-lg"></div>
          </div>
          <div class="skeleton h-3 w-20"></div>
        </div>
        <div class="card bg-raised border border-line rounded-lg p-4">
          <div class="mb-3 flex items-start justify-between gap-3">
            <div class="flex min-w-0 flex-col gap-2">
              <div class="skeleton h-5 w-24"></div>
              <div class="skeleton h-4 w-32"></div>
            </div>
            <div class="skeleton h-11 w-32 rounded-lg"></div>
          </div>
          <div class="skeleton h-3 w-20"></div>
        </div>
        <div class="card bg-raised border border-line rounded-lg p-4">
          <div class="mb-3 flex items-start justify-between gap-3">
            <div class="flex min-w-0 flex-col gap-2">
              <div class="skeleton h-5 w-24"></div>
              <div class="skeleton h-4 w-32"></div>
            </div>
            <div class="skeleton h-11 w-32 rounded-lg"></div>
          </div>
          <div class="skeleton h-3 w-20"></div>
        </div>
        <p class="text-small text-muted" id="bins-due"></p>
      </div>
      <div id="state-empty" class="state-empty" hidden>
        <p class="text-heading">Nobody in the rota yet</p>
        <p class="text-body text-muted">The rotation starts the first time someone opens the app.</p>
      </div>
      <div id="state-error" class="state-error" hidden>
        <svg class="h-6 w-6 text-danger" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a1 1 0 0 1 1 1v4a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/></svg>
        <p class="text-heading">Couldn't load the rota</p>
        <p class="text-body text-muted">The rota could not be fetched. Ticking is paused until it loads.</p>
        <button id="retry-btn" class="btn-secondary">Retry</button>
      </div>
      <div id="state-loaded" class="flex flex-col gap-3" hidden></div>
    </section>

    <section class="px-4 py-4 border-t border-line">
      <p class="text-small text-muted text-center">rotates every Monday</p>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    const views = {
      loading: document.getElementById('state-loading'),
      loaded: document.getElementById('state-loaded'),
      empty: document.getElementById('state-empty'),
      error: document.getElementById('state-error'),
    };
    const banner = document.getElementById('bin-banner');

    function show(state) {
      for (const [name, el] of Object.entries(views)) el.hidden = name !== state;
    }

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday',
                  'Thursday', 'Friday', 'Saturday'];

    // "week of Monday 6 Oct", from the server's UTC Monday, written in the
    // sketch's style (English month abbreviations).
    function formatWeek(weekStart) {
      const [y, m, d] = weekStart.split('-').map(Number);
      const date = new Date(Date.UTC(y, m - 1, d));
      return 'week of ' + DAYS[date.getUTCDay()] + ' ' + d + ' ' + MONTHS[m - 1];
    }

    // One chore card: name (with a "done" badge once ticked), whose turn
    // in the accent colour, the due day, and who takes it next — the
    // rotation made visible. People's names go in as text, never as HTML.
    function choreCard(chore) {
      const card = document.createElement('div');
      card.className = 'card bg-raised border border-line rounded-lg p-4 chore-card';

      const top = document.createElement('div');
      top.className = 'mb-3 flex items-start justify-between gap-3';

      const left = document.createElement('div');
      left.className = 'min-w-0';

      const nameRow = document.createElement('div');
      nameRow.className = 'flex items-center gap-2';
      const name = document.createElement('h2');
      name.className = 'text-heading font-semibold text-fg';
      name.textContent = chore.name;
      nameRow.append(name);
      if (chore.done) {
        const badge = document.createElement('span');
        badge.className = 'rounded-full bg-accent/10 px-2 py-0.5 text-small font-medium text-accent';
        badge.textContent = 'done';
        nameRow.append(badge);
      }
      left.append(nameRow);

      const turn = document.createElement('p');
      turn.className = 'text-body font-medium text-accent';
      turn.textContent = chore.turn ? chore.turn.username + "'s turn" : '';
      left.append(turn);

      const btn = document.createElement('button');
      btn.className = chore.done ? 'btn-secondary shrink-0' : 'btn-primary shrink-0';
      btn.textContent = chore.done ? 'undo' : 'mark as done';
      btn.addEventListener('click', () => toggleDone(chore));
      top.append(left, btn);

      const due = document.createElement('p');
      due.className = 'text-small text-muted';
      due.textContent = 'due ' + chore.dueDay;
      card.append(top, due);

      if (chore.next) {
        const next = document.createElement('p');
        next.className = 'text-small text-muted';
        next.textContent = 'next: ' + chore.next.username;
        card.append(next);
      }
      return card;
    }

    // Is the reminder showing right now, and is it tonight or tomorrow?
    // The viewer's own clock decides: the server cannot know their zone.
    // "The night before" starts at 5 pm on the day before bins are due.
    function binNight(dueDay) {
      const due = DAYS.indexOf(dueDay);
      if (due === -1) return null;
      const now = new Date();
      if (now.getDay() === due) return 'tonight';
      if ((now.getDay() + 1) % 7 === due && now.getHours() >= 17) return 'tomorrow';
      return null;
    }

    // Banner text is set with textContent so a name can never become markup.
    function renderBanner(chores) {
      const bins = chores.find((c) => c.name === 'bins');
      const night = bins && bins.turn ? binNight(bins.dueDay) : null;
      if (!night) {
        banner.hidden = true;
        return;
      }
      banner.replaceChildren(
        document.createTextNode('Bin night ' + night + ': it\u2019s '),
        Object.assign(document.createElement('strong'), { textContent: bins.turn.username }),
        document.createTextNode('\u2019s turn.')
      );
      banner.hidden = false;
    }

    function applyState(data) {
      document.getElementById('week-line').textContent = formatWeek(data.weekStart);
      renderBanner(data.chores);
      // Empty only when the load WORKED and found nobody in the rotation:
      // nobody means no turn rows, so every turn is blank.
      if (!data.chores.length || data.chores.every((c) => !c.turn)) {
        show('empty');
        return;
      }
      views.loaded.replaceChildren(...data.chores.map(choreCard));
      show('loaded');
    }

    async function toggleDone(chore) {
      try {
        const res = await fetch('/api/chores/' + chore.id + '/done', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
        });
        if (!res.ok) return; // 401: the bridge shows "Make an account".
        applyState(await res.json());
      } catch {}
    }

    async function loadState() {
      show('loading');
      let data;
      try {
        const res = await fetch('/api/state', { headers });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
      } catch {
        show('error');
        return;
      }
      applyState(data);
    }

    document.getElementById('retry-btn').addEventListener('click', loadState);

    loadState();
  </script>
</body>
</html>
