<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Flat 4B Chores</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main class="mx-auto flex max-w-md flex-col gap-8 px-4 py-10">

    <header class="px-4 py-6 bg-surface">
      <h1 class="text-title font-bold text-fg">Flat 4B Chores</h1>
      <!-- Filled in from GET /api/chores once the week is known. -->
      <p id="week" class="text-muted text-small"></p>
    </header>

    <section class="px-4 flex flex-col gap-3">
      <!-- What happened after a tap: "bins marked as done", or why a tick
           didn't save. Always in the layout (min-h-6) so nothing jumps. -->
      <p id="status" class="min-h-6 text-body font-medium" role="status"></p>

      <!-- The week's chores, one card per chore. Exactly one of these four
           states shows at a time: loading, the cards, empty (the load worked
           and found nothing) or error (it did not load). -->
      <div id="chores-loading" role="status">
        <span class="sr-only">Loading the chores</span>
        <div class="list">
          <div class="list-row"><div class="skeleton h-4 w-1/2"></div></div>
          <div class="list-row"><div class="skeleton h-4 w-1/3"></div></div>
          <div class="list-row"><div class="skeleton h-4 w-2/5"></div></div>
        </div>
      </div>
      <div id="chores-list" class="flex flex-col gap-3" hidden></div>
      <div id="chores-empty" class="state-empty" hidden>
        <p class="text-heading">No chores yet</p>
        <p class="text-body text-muted">This flat hasn't added any chores.</p>
      </div>
      <div id="chores-error" class="state-error" hidden>
        <svg class="h-6 w-6 text-danger" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a1 1 0 0 1 1 1v4a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"/></svg>
        <p class="text-heading">Couldn't load the chores</p>
        <p class="text-body text-muted">The rest of the app still works; try again.</p>
        <button id="chores-retry" class="btn-secondary">Retry</button>
      </div>
    </section>

    <section class="px-4 py-4 border-t border-line">
      <p class="text-small text-muted text-center">rotates every Monday</p>
    </section>
  </main>

  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};

    const weekEl = document.getElementById('week');
    const statusEl = document.getElementById('status');
    const views = {
      loading: document.getElementById('chores-loading'),
      list: document.getElementById('chores-list'),
      empty: document.getElementById('chores-empty'),
      error: document.getElementById('chores-error'),
    };
    function show(state) {
      for (const [name, el] of Object.entries(views)) el.hidden = name !== state;
    }

    // The API's week is always a Monday; the sketch's wording does the rest.
    function formatWeek(week) {
      const d = new Date(week + 'T00:00:00Z');
      if (isNaN(d)) return '';
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return 'week of Monday ' + d.getUTCDate() + ' ' + months[d.getUTCMonth()];
    }

    // The one status line: a confirmation in the accent colour after a tick,
    // in the danger colour when something didn't work. Clears after a few
    // seconds, and always keeps its height so the layout doesn't jump.
    let statusTimer;
    function showStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = 'min-h-6 text-body font-medium ' + (isError ? 'text-danger' : 'text-accent');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 4000);
    }

    // One chore card, same shape and words as the sketch: name, whose turn,
    // due day, and either the mark-as-done button or a plain done label.
    function choreCard(chore, index) {
      const card = document.createElement('div');
      card.className = 'card bg-raised border border-line rounded-lg p-4';

      const top = document.createElement('div');
      top.className = 'flex items-start justify-between mb-3';

      const info = document.createElement('div');
      info.className = 'min-w-0';
      const name = document.createElement('h2');
      name.className = 'text-heading font-semibold text-fg';
      name.textContent = chore.name;
      const turn = document.createElement('p');
      turn.className = 'text-body text-accent font-medium';
      turn.textContent = chore.person + "'s turn";
      info.append(name, turn);

      if (chore.done) {
        const done = document.createElement('p');
        done.className = 'text-body text-accent font-medium';
        done.textContent = 'done';
        top.append(info, done);
      } else {
        const button = document.createElement('button');
        // Whole literals only, so the precompiled Tailwind build sees them.
        button.className = index === 0 ? 'btn-primary shrink-0' : 'btn-secondary shrink-0';
        button.textContent = 'mark as done';
        button.addEventListener('click', () => markDone(chore, button, index));
        top.append(info, button);
      }

      const due = document.createElement('p');
      due.className = 'text-small text-muted';
      due.textContent = 'due ' + chore.dueDay;

      card.append(top, due);
      return card;
    }

    function renderChores() {
      views.list.replaceChildren(...chores.map((chore, index) => choreCard(chore, index)));
    }

    async function markDone(chore, button, index) {
      button.disabled = true;
      let updated;
      try {
        const res = await fetch('/api/chores/' + chore.id + '/done', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
        });
        if (res.status === 401) {
          button.disabled = false;
          showStatus('Make an account to continue', true);
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        updated = (await res.json()).chore;
      } catch {
        button.disabled = false;
        showStatus(chore.name + " wasn't marked as done. Try again.", true);
        return;
      }
      chores[index] = updated;
      views.list.replaceChild(choreCard(updated, index), views.list.children[index]);
      showStatus(chore.name + ' marked as done', false);
    }

    let chores = [];

    async function loadChores() {
      show('loading');
      let data;
      try {
        const res = await fetch('/api/chores', { headers });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
      } catch {
        show('error');
        return;
      }
      weekEl.textContent = formatWeek(data.week);
      chores = data.chores;
      renderChores();
      show(chores.length ? 'list' : 'empty');
    }

    document.getElementById('chores-retry').addEventListener('click', loadChores);
    loadChores();
  </script>
</body>
</html>
